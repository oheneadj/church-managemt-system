; Queue workers for the `worker` role (docs/16-deployment-and-ops.md, Laravel queues docs, decision D-025).
;
; Runs as www-data, not root, so there is no user= line: Supervisor can only switch user when it starts as root.
; Everything logs to stdout so Coolify shows it; log files inside the container would vanish on every deploy.
; --max-time restarts each worker hourly to release memory; Supervisor starts it again straight away.
; stopwaitsecs must be longer than the slowest job (Laravel docs). No job runs longer than two minutes today.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; OTP SMS only. Its own worker so a slow broadcast can never delay a sign-in.
[program:queue-critical]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=critical --sleep=1 --tries=3 --backoff=5 --max-time=3600
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:queue-payments]
